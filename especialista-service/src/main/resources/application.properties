spring.application.name=especialista-service
server.port=8083

# Comunicacion asincrona tipo BookingGym con RabbitMQ.
# Queda desactivada por defecto para no afectar el arranque del proyecto si no hay broker.
piedrazul.async.enabled=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
