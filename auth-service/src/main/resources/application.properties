spring.application.name=auth-service
server.port=8080

spring.datasource.url=jdbc:sqlite:auth.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8085}
keycloak.realm=${KEYCLOAK_REALM:piedrazul}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:piedrazul-auth-service}
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
